{% extends "base.html" %}
{% block title %}{{ t("rep.title") }} | cpulsepro{% endblock %}

{% block content %}
<!-- هدر + فیلترها -->
<div class="flex flex-col md:flex-row-reverse justify-between items-start md:items-center gap-6 mb-8">
  <div>
    <h2 class="font-headline text-2xl font-bold text-on-surface">{{ t("rep.title") }}</h2>
    <p class="text-on-surface-variant text-sm mt-1">{{ t("rep.subtitle") }}</p>
  </div>
  <div class="flex flex-wrap gap-3 bg-surface-container-low p-2 rounded-xl border border-outline-variant/20">
    <select id="f_account" class="field !w-auto min-w-[150px]" onchange="loadReport()"></select>
    <select id="f_days" class="field !w-auto" onchange="loadReport()">
      <option value="7">{{ t("rep.days", n=7) }}</option><option value="30" selected>{{ t("rep.days", n=30) }}</option>
      <option value="90">{{ t("rep.days", n=90) }}</option><option value="0">{{ t("common.all") }}</option>
    </select>
    <select id="f_mode" class="field !w-auto" onchange="loadReport()">
      <option value="">{{ t("rep.all_modes") }}</option><option value="paper">Paper</option><option value="live">Live</option>
    </select>
    <button id="resetBtn" onclick="resetReport()" title="{{ t('rep.reset_title') }}"
      class="py-1.5 px-3 rounded-lg border border-sell/30 text-sell text-[11px] hover:bg-sell/10 transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">delete_sweep</span> {{ t("rep.reset_btn") }}
    </button>
  </div>
</div>

<div id="reportRoot"><div class="text-center text-on-surface-variant py-16 text-sm">{{ t("common.loading") }}</div></div>

<button onclick="window.print()" title="{{ t('rep.print') }}"
  class="fixed bottom-20 md:bottom-8 left-6 w-14 h-14 bg-primary text-on-primary rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all z-50">
  <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">print</span>
</button>
{% endblock %}

{% block scripts %}
<script>
const CLOSED_BY_LABELS = { SL: t('closed_by.SL'), TP: t('closed_by.TP'), manual: t('closed_by.manual'), exchange: t('closed_by.exchange'), reversal: t('closed_by.reversal'), TRAIL: t('closed_by.TRAIL'), strategy: t('closed_by.strategy') };
let reportData = null;
let tradePage = 1;
const PAGE_SIZE = 10;
let tradeFilter = '';

let accountsById = {};
let copyData = null;

async function init() {
  const accounts = await callApi('/api/accounts');
  accountsById = Object.fromEntries(accounts.map(a => [a.id, a]));
  const sel = document.getElementById('f_account');
  if (!accounts.length) {
    document.getElementById('reportRoot').innerHTML =
      `<div class="glass-card rounded-2xl p-10 text-center text-on-surface-variant">${t('rep.no_account')}</div>`;
    return;
  }
  sel.innerHTML = `<option value="__combined__">${t('rep.combined_option')}</option>`
    + accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  // پیش‌فرض همان تک‌حساب اول می‌ماند تا رفتار آشنای قبلی عوض نشود؛
  // «مجموع» یک انتخاب آگاهانه است، نه چیزی که ناگهان جای گزارش قبلی بنشیند.
  sel.value = accounts[0].id;
  const urlAcc = new URLSearchParams(location.search).get('acc');
  if (urlAcc === '__combined__' || (urlAcc && accounts.some(a => a.id === urlAcc))) sel.value = urlAcc;
  loadReport();
}

function isCombined() {
  return document.getElementById('f_account').value === '__combined__';
}

async function loadReport() {
  const accId = document.getElementById('f_account').value;
  if (!accId) return;
  const days = document.getElementById('f_days').value;
  const mode = document.getElementById('f_mode').value;
  const combined = isCombined();
  // در حالت مجموع، حالت معامله همیشه «واقعی» است و ریست تک‌حسابی معنا ندارد.
  document.getElementById('f_mode').classList.toggle('hidden', combined);
  document.getElementById('resetBtn').classList.toggle('hidden', combined);
  const root = document.getElementById('reportRoot');
  root.innerHTML = `<div class="text-center text-on-surface-variant py-16 text-sm">${t('rep.loading_report')}</div>`;
  try {
    let url;
    if (combined) {
      url = `/api/reports/combined?days=${days}`;
    } else {
      url = `/api/accounts/${accId}/report?days=${days}`;
      if (mode) url += `&mode=${mode}`;
    }
    // گزارش کپی‌ترید موازی گرفته می‌شود و خطایش گزارش اصلی را از بین نمی‌برد
    const acc = accountsById[accId];
    const wantsCopy = !combined && acc && acc.account_type === 'copy_trading';
    const copyPromise = wantsCopy
      ? callApi(`/api/accounts/${accId}/copy-report?days=${days}`).catch(e => ({_failed: e.message}))
      : Promise.resolve(null);

    reportData = await callApi(url);
    copyData = await copyPromise;
    if (combined && !(reportData.accounts || []).length) {
      root.innerHTML = `<div class="glass-card rounded-2xl p-10 text-center text-on-surface-variant">${t('rep.combined_empty')}</div>`;
      return;
    }
    const eq = reportData.equity_curve || [];
    if (eq.length > 600) {
      const step = Math.ceil(eq.length / 600);
      const sampled = eq.filter((_, i) => i % step === 0);
      if (sampled[sampled.length - 1] !== eq[eq.length - 1]) sampled.push(eq[eq.length - 1]);
      reportData.equity_curve = sampled;
    }
    tradePage = 1;
    renderReport();
  } catch (e) {
    root.innerHTML = `<div class="glass-card rounded-2xl p-10 text-center text-sell">${t('rep.load_error', {msg: e.message})}</div>`;
  }
}

function svgEquityChart(points) {
  const W = 1000, H = 300, padL = 62, padR = 14, padT = 14, padB = 30;
  if (!points || points.length < 2) {
    return `<div class="text-center text-on-surface-variant text-sm py-16">${t('rep.no_equity')}</div>`;
  }
  const vals = points.map(p => Number(p.equity));
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  if (vMax === vMin) { vMax += 1; vMin -= 1; }
  const span = vMax - vMin, pad = span * 0.08;
  vMin -= pad; vMax += pad;
  const X = i => padL + (i / (points.length - 1)) * (W - padL - padR);
  const Y = v => padT + (1 - (v - vMin) / (vMax - vMin)) * (H - padT - padB);
  let grid = '', labels = '';
  for (let g = 0; g <= 4; g++) {
    const v = vMin + (g / 4) * (vMax - vMin);
    const y = Y(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2F333E" stroke-width="1" stroke-dasharray="3,4"/>`;
    labels += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#919094" font-family="JetBrains Mono">${niceNum(v)}</text>`;
  }
  for (let g = 0; g <= 4; g++) {
    const i = Math.round((g / 4) * (points.length - 1));
    const t = String(points[i].time || '').slice(5, 16).replace('T', ' ');
    labels += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#919094" font-family="JetBrains Mono">${t}</text>`;
  }
  const line = points.map((p, i) => `${X(i).toFixed(1)},${Y(Number(p.equity)).toFixed(1)}`).join(' ');
  // منحنی اثر واریز/برداشت را ندارد، پس بدون نشانه معلوم نیست چرا سرمایه عوض
  // شده ولی خط پله نخورده. هر جریان بیرونی یک خط‌چین عمودی می‌گیرد.
  const flowMarks = points.map((p, i) => {
    const f = Number(p.flow || 0);
    if (!f || Math.abs(f) < 0.01) return '';
    const x = X(i).toFixed(1);
    const col = f > 0 ? '#4edea3' : '#f6465d';
    return `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}" stroke="${col}" stroke-width="1" stroke-dasharray="2,3" opacity="0.55"/>`;
  }).join('');
  const first = Number(points[0].equity), last = Number(points[points.length - 1].equity);
  const up = last >= first;
  const color = up ? '#2ebd85' : '#f6465d';
  return `<svg class="w-full" viewBox="0 0 ${W} ${H}" id="eqSvg" onmousemove="eqHover(event)" onmouseleave="eqLeave()">
    <defs><linearGradient id="eqGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    ${flowMarks}
    <polygon points="${padL},${H - padB} ${line} ${W - padR},${H - padB}" fill="url(#eqGrad)"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px ${color}55)"/>
    <line id="eqCursor" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="#919094" stroke-width="1" opacity="0"/>
    <circle id="eqDot" r="4" fill="${color}" stroke="#0A0A0B" stroke-width="2" opacity="0"/>
    ${labels}
  </svg>
  <div class="mono-num text-[11px] text-secondary-fixed-dim mt-2 min-h-[16px]" dir="ltr" id="eqTip"></div>
  <p class="text-[10px] text-on-surface-variant leading-5 mt-1">${t('rep.eq_note')}</p>`;
}

function eqHover(ev) {
  const svg = document.getElementById('eqSvg');
  if (!svg || !reportData) return;
  const pts = reportData.equity_curve || [];
  if (pts.length < 2) return;
  const rect = svg.getBoundingClientRect();
  const W = 1000, padL = 62, padR = 14;
  const x = (ev.clientX - rect.left) / rect.width * W;
  let i = Math.round((x - padL) / (W - padL - padR) * (pts.length - 1));
  i = Math.max(0, Math.min(pts.length - 1, i));
  const p = pts[i];
  const vals = pts.map(q => Number(q.equity));
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  if (vMax === vMin) { vMax += 1; vMin -= 1; }
  const span = vMax - vMin, pad = span * 0.08;
  vMin -= pad; vMax += pad;
  const H = 300, padT = 14, padB = 30;
  const px = padL + (i / (pts.length - 1)) * (W - padL - padR);
  const py = padT + (1 - (Number(p.equity) - vMin) / (vMax - vMin)) * (H - padT - padB);
  const cur = document.getElementById('eqCursor'), dot = document.getElementById('eqDot');
  if (cur) { cur.setAttribute('x1', px); cur.setAttribute('x2', px); cur.setAttribute('opacity', '0.5'); }
  if (dot) { dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.setAttribute('opacity', '1'); }
  const tip = document.getElementById('eqTip');
  if (tip) {
    const when = String(p.time || '').slice(0, 16).replace('T', ' ');
    const f = Number(p.flow || 0);
    const flowTxt = (f && Math.abs(f) >= 0.01)
      ? '  •  ' + t(f > 0 ? 'rep.flow_deposit' : 'rep.flow_withdraw', {amount: niceNum(Math.abs(f))})
      : '';
    const raw = p.raw_equity != null ? p.raw_equity : p.equity;
    tip.textContent = `${when} — ${t('rep.eq_adjusted')}: ${niceNum(Number(p.equity))} USDT`
      + `  (${t('rep.eq_raw')}: ${niceNum(Number(raw))})${flowTxt}`;
  }
}
function eqLeave() {
  const cur = document.getElementById('eqCursor'), dot = document.getElementById('eqDot');
  if (cur) cur.setAttribute('opacity', '0');
  if (dot) dot.setAttribute('opacity', '0');
  const tip = document.getElementById('eqTip');
  if (tip) tip.textContent = '';
}

function svgDailyPnl(daily) {
  const W = 1000, H = 180, padL = 62, padR = 14, padT = 12, padB = 26;
  if (!daily || !daily.length) {
    return `<div class="text-center text-on-surface-variant text-sm py-10">${t('rep.no_closed')}</div>`;
  }
  const vals = daily.map(d => Number(d.pnl));
  let vMax = Math.max(0, ...vals), vMin = Math.min(0, ...vals);
  if (vMax === vMin) { vMax = 1; vMin = -1; }
  const span = vMax - vMin;
  vMax += span * 0.1; vMin -= span * 0.1;
  const Y = v => padT + (1 - (v - vMin) / (vMax - vMin)) * (H - padT - padB);
  const zeroY = Y(0);
  const n = daily.length;
  const bw = Math.min(36, Math.max(3, (W - padL - padR) / n * 0.65));
  let bars = '', labels = '';
  daily.forEach((d, i) => {
    const cx = padL + ((i + 0.5) / n) * (W - padL - padR);
    const v = Number(d.pnl);
    const y1 = Math.min(zeroY, Y(v)), h = Math.max(1.5, Math.abs(Y(v) - zeroY));
    const c = v >= 0 ? '#2ebd85' : '#f6465d';
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${c}" opacity="0.85">
      <title>${d.date} | PnL: ${niceNum(v)} USDT | ${d.trades} ${t('rep.trades_word')}</title></rect>`;
    if (n <= 16 || i % Math.ceil(n / 12) === 0) {
      labels += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#919094" font-family="JetBrains Mono">${String(d.date).slice(5)}</text>`;
    }
  });
  return `<svg class="w-full" viewBox="0 0 ${W} ${H}">
    <line x1="${padL}" y1="${zeroY}" x2="${W - padR}" y2="${zeroY}" stroke="#919094" stroke-width="1" opacity="0.5"/>
    ${bars}${labels}
  </svg>`;
}

function filteredTrades() {
  let trades = reportData.trades || [];
  if (tradeFilter) trades = trades.filter(tr => (tr.symbol || '').toUpperCase().includes(tradeFilter));
  // مرتب‌سازی صریح بر اساس زمان بستن، جدیدترین اول — به ترتیبی که بک‌اند
  // برمی‌گرداند تکیه نمی‌کنیم. رشته‌ی ISO با UTC یکسان، مقایسه‌ی رشته‌ای هم
  // درست است، ولی برای رکوردهای قدیمیِ بدون منطقه‌ی زمانی از parseUtc
  // استفاده می‌کنیم تا همه با یک مبنا مقایسه شوند.
  const key = tr => { const d = parseUtc(tr.close_time); return d ? d.getTime() : -Infinity; };
  return trades.slice().sort((a, b) => key(b) - key(a));
}

function renderTradesTable() {
  const trades = filteredTrades();
  const total = trades.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  tradePage = Math.min(Math.max(1, tradePage), pages);
  const slice = trades.slice((tradePage - 1) * PAGE_SIZE, tradePage * PAGE_SIZE);
  // پارامتر عمداً tr نام دارد نه t — نام t تابع سراسری ترجمه را سایه می‌اندازد
  // و هر فراخوانی t('...') داخل این بلاک را می‌شکند.
  const rows = slice.map(tr => {
    const r = Number(tr.realized || 0);
    const cls = r >= 0 ? 'text-buy' : 'text-sell';
    const side = tr.side === 'long'
      ? '<span class="bg-buy/10 text-buy px-2 py-0.5 rounded text-[11px] font-bold border border-buy/20">LONG</span>'
      : '<span class="bg-sell/10 text-sell px-2 py-0.5 rounded text-[11px] font-bold border border-sell/20">SHORT</span>';
    const by = CLOSED_BY_LABELS[tr.closed_by] || tr.closed_by || '—';
    const est = tr.estimated ? ' <span class="text-gold">≈</span>' : '';
    const fee = tr.fee != null ? fmtNum(tr.fee) : '—';
    // تولتیپ: زمان دقیق باز و بسته شدن (با ثانیه). خود سلول بدون ثانیه می‌ماند
    // تا شلوغ نشود. dir=ltr لازم است وگرنه در چیدمان راست‌به‌چپ، ساعت و تاریخ
    // جای هم عوض می‌شوند.
    const times = [
      tr.open_time ? t('rep.opened_at', {time: fmtDateTime(tr.open_time, true)}) : '',
      t('rep.closed_at', {time: fmtDateTime(tr.close_time, true)}),
    ].filter(Boolean).join(' · ').replace(/"/g, '&quot;');
    return `<tr class="hover:bg-surface-variant/20 transition-colors">
      <td class="!text-start text-on-surface-variant text-[11px] whitespace-nowrap" dir="ltr" title="${times}">
        ${fmtDateTime(tr.close_time)}
      </td>
      <td class="font-bold">${tr.symbol || ''}</td><td>${side}</td>
      <td class="num">${fmtNum(tr.qty)}</td>
      <td class="num">${fmtNum(tr.entry_price)}</td><td class="num">${fmtNum(tr.close_price)}</td>
      <td class="text-[11px]">${by}</td>
      <td class="num text-on-surface-variant text-[11px]">${fee}</td>
      <td class="num ${cls} font-bold">${niceNum(r)}${est}</td>
    </tr>`;
  }).join('');
  const start = total ? (tradePage - 1) * PAGE_SIZE + 1 : 0;
  const end = Math.min(total, tradePage * PAGE_SIZE);
  let pageBtns = '';
  const win = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - tradePage) <= 2) win.push(p);
  }
  let prev = 0;
  for (const p of win) {
    if (p - prev > 1) pageBtns += '<span class="w-8 h-8 flex items-center justify-center text-on-surface-variant">…</span>';
    pageBtns += `<button onclick="gotoPage(${p})" class="w-8 h-8 rounded border text-xs font-bold transition-all ${p === tradePage ? 'border-primary/30 bg-primary text-on-primary' : 'border-outline-variant/30 text-on-surface-variant hover:bg-surface-variant'}">${p}</button>`;
    prev = p;
  }
  // روی موبایل جدول ۹ ستونی اسکرول افقی می‌خواست. همان داده‌ها به‌صورت کارت
  // چیده می‌شوند؛ جدول فقط از md به بالا نمایش داده می‌شود.
  const mcell = (label, value, extraCls) => `
    <div>
      <div class="text-[10px] text-on-surface-variant mb-0.5">${label}</div>
      <div class="mono-num text-xs ${extraCls || ''}" dir="ltr">${value}</div>
    </div>`;

  const cards = slice.map(tr => {
    const r = Number(tr.realized || 0);
    const cls = r >= 0 ? 'text-buy' : 'text-sell';
    const side = tr.side === 'long'
      ? '<span class="bg-buy/10 text-buy px-2 py-0.5 rounded text-[10px] font-bold border border-buy/20">LONG</span>'
      : '<span class="bg-sell/10 text-sell px-2 py-0.5 rounded text-[10px] font-bold border border-sell/20">SHORT</span>';
    const by = CLOSED_BY_LABELS[tr.closed_by] || tr.closed_by || '—';
    const est = tr.estimated ? ' <span class="text-gold">≈</span>' : '';
    const fee = tr.fee != null ? fmtNum(tr.fee) : '—';
    return `<div class="border-b border-outline-variant/20 last:border-b-0 p-4">
      <div class="flex items-center justify-between gap-2 mb-1">
        <div class="flex items-center gap-2 min-w-0">
          <span class="font-bold text-sm truncate">${tr.symbol || ''}</span>${side}
        </div>
        <span class="mono-num text-sm font-bold ${cls}" dir="ltr">${niceNum(r)}${est}</span>
      </div>
      <div class="text-[10px] text-on-surface-variant mb-3" dir="ltr">${fmtDateTime(tr.close_time)}</div>
      <div class="grid grid-cols-3 gap-y-3 gap-x-2">
        ${mcell(t('dash.th_qty'), fmtNum(tr.qty))}
        ${mcell(t('rep.th_entry_price'), fmtNum(tr.entry_price))}
        ${mcell(t('rep.th_exit_price'), fmtNum(tr.close_price))}
        ${mcell(t('rep.th_closed_by'), by)}
        ${mcell(t('common.fees'), fee)}
      </div>
    </div>`;
  }).join('');

  const emptyMsg = `<div class="text-center text-on-surface-variant py-8 text-sm">${t('rep.no_trades')}</div>`;

  return `<div class="hidden md:block overflow-x-auto"><table class="of-table">
      <thead><tr><th>${t('rep.th_time')}</th><th>${t('common.symbol')}</th><th>${t('rep.th_type')}</th><th>${t('dash.th_qty')}</th><th>${t('rep.th_entry_price')}</th><th>${t('rep.th_exit_price')}</th><th>${t('rep.th_closed_by')}</th><th>${t('common.fees')}</th><th>${t('rep.th_net_usdt')}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="9" class="text-center text-on-surface-variant py-8">${t('rep.no_trades')}</td></tr>`}</tbody>
    </table></div>
    <div class="md:hidden">${cards || emptyMsg}</div>
    <div class="px-5 py-4 flex flex-row-reverse flex-wrap gap-2 justify-between items-center bg-surface-container-low border-t border-outline-variant/20">
      <span class="text-xs text-on-surface-variant">${t('rep.showing', {start: start, end: end, total: total})}</span>
      <div class="flex gap-1 shrink-0">
        <button onclick="gotoPage(${tradePage - 1})" class="w-8 h-8 flex items-center justify-center rounded border border-outline-variant/30 text-on-surface-variant hover:bg-surface-variant"><span class="material-symbols-outlined text-base">chevron_right</span></button>
        ${pageBtns}
        <button onclick="gotoPage(${tradePage + 1})" class="w-8 h-8 flex items-center justify-center rounded border border-outline-variant/30 text-on-surface-variant hover:bg-surface-variant"><span class="material-symbols-outlined text-base">chevron_left</span></button>
      </div>
    </div>`;
}

async function resetReport() {
  const accId = document.getElementById('f_account').value;
  if (!accId || isCombined()) return;
  const accName = document.getElementById('f_account').selectedOptions[0]?.textContent || '';
  if (!askConfirm(t('rep.reset_confirm', {name: accName}))) return;
  try {
    await callApi(`/api/accounts/${accId}/report/reset`, 'POST');
    toast(t('rep.reset_done'));
    loadReport();
  } catch (e) {
    toast(t('common.error_prefix') + e.message, true);
  }
}

function gotoPage(p) {
  tradePage = p;
  document.getElementById('tradesWrap').innerHTML = renderTradesTable();
}

function onTradeSearch(v) {
  tradeFilter = v.trim().toUpperCase();
  tradePage = 1;
  document.getElementById('tradesWrap').innerHTML = renderTradesTable();
}

// ---------- بخش‌های مخصوص حساب کپی‌ترید ----------
// یک حساب لیدر دو منبع درآمد دارد: سود معاملات خودش، و سهمی که از سود
// دنبال‌کننده‌ها می‌گیرد. دومی هیچ‌جای گزارش معاملات دیده نمی‌شود.
function fmtDuration(ms) {
  const days = Math.floor((Number(ms) || 0) / 86400000);
  if (days >= 1) return t('rep.cp_days', {n: days});
  const hours = Math.floor((Number(ms) || 0) / 3600000);
  return t('rep.cp_hours', {n: hours});
}

function copyStatCard(label, value, sub, cls) {
  return `<div class="glass-card p-5 rounded-2xl flex flex-col items-center text-center">
    <span class="text-on-surface-variant text-xs mb-2">${label}</span>
    <span class="mono-num text-2xl font-bold ${cls || ''}" dir="ltr">${value}</span>
    ${sub ? `<span class="text-[11px] text-on-surface-variant mt-1">${sub}</span>` : ''}
  </div>`;
}

    <div class="glass-card p-5 rounded-2xl flex flex-col items-center text-center">
      <span class="text-on-surface-variant text-xs mb-2">${t('rep.pf_dd')}</span>
      <span class="mono-num text-2xl font-bold text-secondary-fixed-dim" dir="ltr">${s.trades ? pf : '—'}</span>
      <span class="text-[11px] text-sell mt-1" dir="ltr">${fmt(s.max_drawdown_pct, 2)}${t('common.pct')} DD</span>
    </div>
    <div class="glass-card p-5 rounded-2xl flex flex-col items-center text-center">
      <span class="text-on-surface-variant text-xs mb-2">${t('rep.total_fees')}</span>
      <span class="mono-num text-2xl font-bold text-gold" dir="ltr">${niceNum(s.total_fees)}</span>
      <span class="text-[11px] text-on-surface-variant mt-1">${t('rep.this_period')}</span>
    </div>
  </div>

  <div class="glass-card p-5 rounded-2xl mb-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-headline font-bold flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">timeline</span> ${t('rep.equity_curve')}
      </h3>
      <span class="mono-num text-xs text-on-surface-variant" dir="ltr">USDT</span>
    </div>
    ${svgEquityChart(reportData.equity_curve)}
  </div>

  <div class="glass-card p-5 rounded-2xl mb-6">
    <h3 class="font-headline font-bold mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">bar_chart</span> ${t('rep.daily_pnl_chart')}
    </h3>
    ${svgDailyPnl(reportData.daily)}
  </div>

  ${renderCopySection()}

  ${isCombined() ? renderAccountBreakdown() : renderAccountDetails()}

  <div class="glass-card rounded-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-outline-variant/20 flex justify-between items-center bg-surface-container-low flex-wrap gap-3">
      <h3 class="font-headline font-bold">${t('rep.trade_history')}</h3>
      <input class="field !w-56" placeholder="${t('rep.search_symbol')}" dir="ltr" oninput="onTradeSearch(this.value)">
    </div>
    <div id="tradesWrap">${renderTradesTable()}</div>
  </div>
  ${s.has_estimated ? `<div class="text-[11px] text-gold mt-3">${t('rep.estimated_note')}</div>` : ''}`;
}

init().catch(e => toast(t('common.error_prefix') + e.message, true));
</script>
{% endblock %}
