<!DOCTYPE html>
<html class="dark" dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ورود | کریپتو بات</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { colors: {
  "surface": "#141313", "surface-container-low": "#1c1b1b", "on-surface": "#e5e2e1",
  "on-surface-variant": "#c7c6ca", "outline-variant": "#46464a", "primary": "#c8c6c7",
  "on-primary": "#313031", "sell": "#f6465d", "gold": "#f0b90b",
}, fontFamily: { headline: ["Vazirmatn"], body: ["Vazirmatn"] } } } }
</script>
<style>
  html { color-scheme: dark; }
  body { background-color: #0A0A0B; font-family: 'Vazirmatn', sans-serif; color: #e5e2e1; }
  .glass-card { background: rgba(30, 34, 45, 0.8); backdrop-filter: blur(20px); border: 1px solid #2F333E; }
  .field {
    width: 100%; background-color: #0e0e0e !important; border: 1px solid #2F333E; color: #e5e2e1 !important;
    border-radius: 0.25rem; padding: 0.6rem 0.85rem; font-family: inherit; font-size: 0.9rem; color-scheme: dark;
  }
  .field:focus { outline: none; border-color: #4d7cfe; box-shadow: 0 0 0 3px rgba(77,124,254,.15); }
  .btn-primary-of {
    background: #c8c6c7; color: #313031; border-radius: 0.25rem; font-weight: 700;
    padding: 0.65rem 1.2rem; font-size: 0.9rem; transition: .2s; cursor: pointer; border: none; width: 100%;
  }
  .btn-primary-of:hover { background: #e5e2e3; }
  .btn-primary-of:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-full mb-3 bg-gold/15 flex items-center justify-center border border-gold/30">
        <span class="material-symbols-outlined text-gold text-3xl">candlestick_chart</span>
      </div>
      <h1 class="font-headline text-2xl font-black">کریپتو بات</h1>
      <p class="text-xs text-on-surface-variant mt-1">داشبورد معاملات هوشمند فیوچرز</p>
    </div>
    <div class="glass-card rounded-2xl p-6">
      <h2 class="font-headline text-lg font-bold mb-5 text-center">ورود به حساب</h2>
      <div id="err" class="hidden text-sell text-xs bg-sell/10 border border-sell/30 rounded-lg p-2.5 mb-4 text-center"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs text-on-surface-variant mb-1.5">نام کاربری</label>
          <input id="username" class="field" autocomplete="username" required>
        </div>
        <div>
          <label class="block text-xs text-on-surface-variant mb-1.5">رمز عبور</label>
          <input id="password" type="password" class="field" autocomplete="current-password" required>
        </div>
        <button id="submitBtn" type="submit" class="btn-primary-of">ورود</button>
      </form>
      <p class="text-center text-xs text-on-surface-variant mt-5">
        حساب ندارید؟ <a href="/register" class="text-gold hover:underline">ثبت‌نام کنید</a>
      </p>
    </div>
  </div>
<script>
const params = new URLSearchParams(location.search);
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  err.classList.add('hidden');
  btn.disabled = true;
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || 'ورود ناموفق بود');
    location.href = params.get('next') || '/';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
