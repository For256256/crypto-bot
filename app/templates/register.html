<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link rel="icon" type="image/png" href="/static/logo-icon.png?v=3">
<title>ثبت‌نام | CryptoPulse</title>
<script>
(function() {
  var pref = localStorage.getItem('cb_theme');
  if (pref === 'dark' || pref === 'light') document.documentElement.setAttribute('data-theme', pref);
})();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&family=Hanken+Grotesk:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { colors: {
  "surface": "rgb(var(--c-surface) / <alpha-value>)", "surface-container-low": "rgb(var(--c-surface-container-low) / <alpha-value>)", "on-surface": "rgb(var(--c-on-surface) / <alpha-value>)",
  "on-surface-variant": "rgb(var(--c-on-surface-variant) / <alpha-value>)", "outline-variant": "rgb(var(--c-outline-variant) / <alpha-value>)", "primary": "rgb(var(--c-primary) / <alpha-value>)",
  "on-primary": "rgb(var(--c-on-primary) / <alpha-value>)", "sell": "rgb(var(--c-sell) / <alpha-value>)", "buy": "rgb(var(--c-buy) / <alpha-value>)", "gold": "rgb(var(--c-gold) / <alpha-value>)",
}, fontFamily: { headline: ["Vazirmatn", "Hanken Grotesk"], body: ["Vazirmatn"] } } } }
</script>
<style>
  :root {
    --c-surface: 11 19 38; --c-surface-container-lowest: 6 14 32; --c-surface-container-low: 19 27 46;
    --c-on-surface: 218 226 253; --c-on-surface-variant: 185 202 202; --c-outline-variant: 58 73 74;
    --c-primary: 0 220 229; --c-on-primary: 0 32 33; --c-sell: 244 63 94; --c-buy: 78 222 163; --c-gold: 240 185 11;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --c-surface: 247 249 252; --c-surface-container-lowest: 255 255 255; --c-surface-container-low: 238 241 247;
      --c-on-surface: 19 26 44; --c-on-surface-variant: 85 96 110; --c-outline-variant: 199 206 217;
      --c-primary: 0 150 158; --c-on-primary: 255 255 255; --c-sell: 225 29 72; --c-buy: 23 145 95; --c-gold: 161 98 7;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --c-surface: 247 249 252; --c-surface-container-lowest: 255 255 255; --c-surface-container-low: 238 241 247;
    --c-on-surface: 19 26 44; --c-on-surface-variant: 85 96 110; --c-outline-variant: 199 206 217;
    --c-primary: 0 150 158; --c-on-primary: 255 255 255; --c-sell: 225 29 72; --c-buy: 23 145 95; --c-gold: 161 98 7;
    color-scheme: light;
  }
  body { background-color: rgb(var(--c-surface)); font-family: 'Vazirmatn', sans-serif; color: rgb(var(--c-on-surface)); }
  .glass-card { background: rgb(var(--c-surface-container-low) / 0.75); backdrop-filter: blur(20px); border: 1px solid rgb(var(--c-on-surface) / 0.08); }
  .field {
    width: 100%; background-color: rgb(var(--c-surface-container-lowest)) !important; border: 1px solid rgb(var(--c-on-surface) / 0.08); color: rgb(var(--c-on-surface)) !important;
    border-radius: 0.25rem; padding: 0.6rem 0.85rem; font-family: inherit; font-size: 0.9rem;
  }
  .field:focus { outline: none; border-color: rgb(var(--c-primary)); box-shadow: 0 0 0 3px rgb(var(--c-primary) / 0.15); }
  .btn-primary-of {
    background: linear-gradient(135deg, #00dce5, #00696e); color: #002021; border-radius: 0.25rem; font-weight: 700;
    padding: 0.65rem 1.2rem; font-size: 0.9rem; transition: .2s; cursor: pointer; border: none; width: 100%;
  }
  .btn-primary-of:hover { box-shadow: 0 0 16px rgba(0,220,229,.4); }
  .btn-primary-of:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="/static/logo-full.png?v=3" alt="CryptoPulse" class="w-full max-w-[260px] h-auto">
      <p class="text-xs text-on-surface-variant mt-2">داشبورد معاملات هوشمند فیوچرز</p>
    </div>
    <div class="glass-card rounded-2xl p-6">
      <h2 class="font-headline text-lg font-bold mb-2 text-center">ساخت حساب جدید</h2>
      <p class="text-[11px] text-on-surface-variant text-center mb-5">
        حساب جدید فقط با حالت کاغذی (paper) قابل استفاده است — برای معامله‌ی واقعی باید از پشتیبانی توکن فعال‌سازی بگیرید.
      </p>
      <div id="err" class="hidden text-sell text-xs bg-sell/10 border border-sell/30 rounded-lg p-2.5 mb-4 text-center"></div>
      <form id="regForm" class="space-y-4">
        <div>
          <label class="block text-xs text-on-surface-variant mb-1.5">نام کاربری</label>
          <input id="username" class="field" autocomplete="username" minlength="3" required>
        </div>
        <div>
          <label class="block text-xs text-on-surface-variant mb-1.5">ایمیل</label>
          <input id="email" type="email" class="field" dir="ltr" autocomplete="email" required>
          <p class="text-[10px] text-on-surface-variant mt-1">سوابق خرید و پیام‌های مهم حساب به این ایمیل ارسال می‌شود.</p>
        </div>
        <div>
          <label class="block text-xs text-on-surface-variant mb-1.5">رمز عبور (حداقل ۶ کاراکتر)</label>
          <input id="password" type="password" class="field" autocomplete="new-password" minlength="6" required>
        </div>
        <div>
          <label class="block text-xs text-on-surface-variant mb-1.5">تکرار رمز عبور</label>
          <input id="password2" type="password" class="field" autocomplete="new-password" minlength="6" required>
        </div>
        <button id="submitBtn" type="submit" class="btn-primary-of">ثبت‌نام</button>
      </form>
      <p class="text-center text-xs text-on-surface-variant mt-5">
        حساب دارید؟ <a href="/login" class="text-primary hover:underline">وارد شوید</a>
      </p>
    </div>
  </div>
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  err.classList.add('hidden');
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) {
    err.textContent = 'رمز عبور و تکرار آن یکسان نیستند';
    err.classList.remove('hidden');
    return;
  }
  btn.disabled = true;
  try {
    const r = await fetch('/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || 'ثبت‌نام ناموفق بود');
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
